[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leap-capstone-eda"
version = "0.1.0"
description = "Fauxnance financial data ETL and EDA pipeline"
requires-python = ">=3.10"

dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "requests>=2.32",
    "pandas>=2.0",
    "numpy>=1.24",
    "duckdb>=1.0",
    "plotly>=5.18",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Tells setuptools that our package lives inside the src/ folder
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# CLI entry points
[project.scripts]
fauxnance-extract  = "src.extract.extract:main"
fauxnance-serve    = "src.api.app:main"
fauxnance-pipeline = "src.pipeline.pipeline:main"
