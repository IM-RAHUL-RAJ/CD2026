server:
  port: 8082

spring:
  application:
    name: trade-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.trading.tradeapi.dto,com.trading.tradeapi.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # JWT secret from environment variable (required - no default)
  secret: ${JWT_SECRET}
