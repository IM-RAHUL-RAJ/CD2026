server:
  port: 8082

spring:
  application:
    name: trade-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:n3u3d4!}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:10.8.71.240:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        batch.size: 16384

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.trading.tradeapi.dto,com.trading.tradeapi.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:akatsuki_akatsuki_akatsuki_akatsuki_akatsuki}
  ttl-seconds: ${JWT_TTL_SECONDS:900}
  expiration:
    ms: 900000
